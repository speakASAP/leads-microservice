apiVersion: v1
kind: ConfigMap
metadata:
  name: leads-microservice-config
  namespace: statex-apps
  labels:
    app: leads-microservice
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "leads-microservice"
  DOMAIN: "leads.alfares.cz"
  PORT: "4400"
  # Add environment variables from .env that are non-sensitive (no secrets, API keys, passwords)
  # Examples:
  # DATABASE_POOL_SIZE: "10"
  # LOG_LEVEL: "info"
  DB_HOST: "db-server-postgres.statex-apps.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "leads"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  NOTIFICATION_SERVICE_URL: "http://notifications-microservice.statex-apps.svc.cluster.local:3368"
  ADMIN_EMAIL: "ssfskype@gmail.com"
  # TIMEOUT_MS: "30000"
  # Orders created-event consumer (secret URL is sourced from Vault via ExternalSecret)
  LEADS_ORDERS_EVENTS_CONSUMER_ENABLED: "true"
  LEADS_ORDERS_EVENTS_EXCHANGE: "orders.events"
  LEADS_ORDERS_EVENTS_ROUTING_KEY: "orders.order.created.v1"
  LEADS_ORDERS_EVENTS_QUEUE: "leads.orders.order-created.v1"
  LEADS_ORDERS_EVENTS_PREFETCH: "5"
  LEADS_ORDERS_EVENTS_DLX: "leads.orders.events.dlx"
  LEADS_ORDERS_EVENTS_DLQ: "leads.orders.order-created.v1.dlq"
  LEADS_ORDERS_EVENTS_REQUEUE_ON_ERROR: "false"
  # EP-005 W5 — registrations become leads.
  #
  # Its OWN queue, not growth-core's `growth.auth-registrations`: `auth.events` is a topic
  # exchange, and two consumers bound to one queue split the messages between them. Each service
  # would then see roughly half the registrations, and both sets of numbers would look plausible.
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.statex-apps.svc.cluster.local:5672"
  LEADS_AUTH_EVENTS_CONSUMER_ENABLED: "true"
  LEADS_AUTH_EVENTS_EXCHANGE: "auth.events"
  LEADS_AUTH_EVENTS_QUEUE: "leads.auth.user-registered.v1"
  LEADS_GROWTH_WORKSPACE_ID: "bazos"
